version: "3.9"

# Sobe as dependências locais do apps/intermediador (Postgres + Redis).
# apps/pdv-backend usa SQLite e não precisa de container nenhum —
# ver Claude/Projetos/EasyPDV/Arquitetura e Stack.md no cofre Obsidian.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: easypdv_intermediador
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
