name: Release

# Dispara em push de tag "v*" (ex.: v1.0.1) — cria/atualiza o release no
# GitHub com o instalador Windows, que os terminais já instalados (via
# apps/electron/src/main/auto-update.ts, checagem a cada 4h/no boot)
# encontram e aplicam sozinhos. workflow_dispatch existe só pra rodar de
# novo sem precisar empurrar outra tag (debug/teste).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Mesmos dois passos de apps/pdv-backend E apps/intermediador que
      # .github/workflows/ci.yml já usa com sucesso em todo push — build do
      # workspace inteiro via turbo builda TODOS os pacotes (intermediador
      # incluso, mesmo irrelevante pro instalador Windows), e intermediador
      # tem `output` próprio de Prisma Client (schema Postgres separado, ver
      # docs/BACKEND.md) que também precisa existir antes do `tsc`. Achado
      # real (2026-08-21): faltou esse passo na primeira tentativa de usar
      # `turbo run build` sem filtro.
      - run: pnpm --filter @easypdv/pdv-backend run prisma:generate
      - run: pnpm --filter @easypdv/intermediador run prisma:generate

      # Build do workspace inteiro via Turborepo (mesmo comando usado o
      # resto desta sessão sem nenhum problema de ordem — `turbo run build`
      # já resolve o grafo de dependências certo sozinho: shared-types/
      # shared-validation antes de pdv-backend/pdv-frontend/electron).
      # Tentativas anteriores com `--filter` customizado (2026-08-21)
      # erraram a sintaxe e incluíam pacotes fora de ordem — sem motivo pra
      # reinventar isso, `pnpm -w build` já é comprovado.
      - run: pnpm turbo run build

      # prepare-resources.js builda pdv-backend/pdv-frontend de novo (cache
      # hit rápido, já buildados acima) e gera o Prisma Client com o engine
      # nativo do runner Windows — precisa disso mesmo já tendo rodado
      # prisma:generate acima (plataforma pode diferir do passo anterior).
      - run: pnpm --filter @easypdv/electron run prepackage

      # Cache do binário do Electron (~115MB) baixado pelo electron-builder —
      # achado real (2026-09-17): o download direto do CDN de release assets
      # do GitHub travou/falhou 3x seguidas (conexão derrubada no meio),
      # travando o release inteiro por dezenas de minutos até cancelar na
      # mão. Sem isso, TODA release baixa o zip do zero; com cache
      # (chaveado pela versão do Electron em package.json), só a primeira
      # release depois de trocar de versão paga esse custo.
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\.electron-builder-cache
          key: electron-builder-cache-${{ runner.os }}-${{ hashFiles('apps/electron/package.json') }}

      # Retry automático (2026-09-17, mesmo achado acima) — o download do
      # binário do Electron por `app-builder-bin` não tem retry/backoff
      # embutido contra uma conexão derrubada no meio; sem isso, qualquer
      # instabilidade pontual do CDN do GitHub exige cancelar e disparar o
      # workflow de novo manualmente. `timeout_minutes` mata uma tentativa
      # travada (achado real: uma tentativa ficou "in_progress" por mais de
      # 40min sem nunca falhar sozinha) em vez de deixar rodando pra sempre.
      - uses: nick-fields/retry@v3
        with:
          timeout_minutes: 8
          max_attempts: 3
          retry_wait_seconds: 20
          command: pnpm --filter @easypdv/electron exec electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.electron-builder-cache
