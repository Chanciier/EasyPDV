name: Release

# Dispara em push de tag "v*" (ex.: v1.0.1) — cria/atualiza o release no
# GitHub com o instalador Windows, que os terminais já instalados (via
# apps/electron/src/main/auto-update.ts, checagem a cada 4h/no boot)
# encontram e aplicam sozinhos. workflow_dispatch existe só pra rodar de
# novo sem precisar empurrar outra tag (debug/teste).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # @easypdv/electron E @easypdv/pdv-backend dependem de pacotes
      # workspace (shared-types/shared-validation/shared-events) que só
      # existem como `dist/` depois de buildados — `tsc` de qualquer um dos
      # dois falha com "Cannot find module" sem isso rodar primeiro. Achado
      # real no primeiro build em ambiente limpo (2026-08-21, dois achados
      # separados na mesma causa): local sempre "funcionava" porque esses
      # dist/ já existiam de builds anteriores nesta máquina.
      - run: pnpm turbo run build --filter=@easypdv/electron^... --filter=@easypdv/pdv-backend^...

      # Shell Electron em si (src/main, src/preload) — tem seu próprio tsc,
      # nunca rodado por `exec electron-builder` direto (esse comando não
      # passa pelo hook "pre" que `pnpm run package` teria).
      - run: pnpm --filter @easypdv/electron run build

      # prepare-resources.js builda pdv-backend/pdv-frontend e gera o
      # Prisma Client — precisa rodar num runner Windows pra pegar o engine
      # nativo certo (mesma disciplina já usada nos testes manuais locais).
      - run: pnpm --filter @easypdv/electron run prepackage

      - run: pnpm --filter @easypdv/electron exec electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
